# Paid single-instance hosting. The owner's allowance is $25 total;
# Render's build-spend limit is not a cap on recurring hosting charges.
services:
  - type: web
    name: deskhop
    runtime: docker
    plan: starter
    region: oregon
    healthCheckPath: /api/health
    autoDeployTrigger: off
    disk:
      name: deskhop-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /app/data/deskhop.sqlite
      - key: SEED_DEMO
        value: "false"
      - key: SEED_REAL
        value: "true"
      - key: SEED_COLORADO
        value: "true"
      - key: FIREBASE_PROJECT_ID
        value: deskhop-9a29f
      - key: FIREBASE_AUTH_DOMAIN
        value: deskhop-9a29f.firebaseapp.com
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: AI_DAILY_CALL_LIMIT
        value: "0"
